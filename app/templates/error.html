<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or 'Error' }} — Semantic Satellite Change Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Inter:ital,opsz,wght@0,14..32,300..900;1,14..32,300..900&family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-[#0F172A] text-slate-100 font-sans min-h-screen flex antialiased">
  {% include 'sidebar.html' %}

  <div class="flex-1 pl-64 flex flex-col min-h-screen bg-[#0F172A] p-8 overflow-y-auto items-center justify-center">
    <div class="max-w-md w-full bg-[#1E293B] border border-slate-700/80 rounded-2xl p-8 text-center shadow-lg">
      <div class="w-14 h-14 rounded-2xl bg-amber-950/70 text-amber-400 border border-amber-800/60 flex items-center justify-center mx-auto mb-4 text-2xl shadow-xs">
        <span class="material-symbols-outlined text-[28px]">warning</span>
      </div>
      <h2 class="text-xl font-bold font-display text-white mb-2">{{ title or 'An Error Occurred' }}</h2>
      <p class="text-sm text-slate-400 mb-6 leading-relaxed">{{ message or 'Unable to complete the requested operation.' }}</p>
      <div class="flex justify-center gap-3">
        <a href="/" class="px-5 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-semibold text-sm transition-all shadow-xs flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[18px]">home</span>
          Return to Dashboard
        </a>
      </div>
    </div>
  </div>
</body>
</html>
